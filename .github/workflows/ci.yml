name: CompanyIQ CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite & Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companyiq/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Pytest Suite (Unit, Edge-Case, Workflow & Evaluation)
        run: |
          pytest tests/ -v --tb=short
        env:
          DEMO_MODE: 'true'
          SECRET_KEY: 'test-secret-key-for-continuous-integration-pipeline-only'

  frontend-tests:
    name: Frontend Build & Component Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companyiq/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: companyiq/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript & Build Vite Production Bundle
        run: npm run build

      - name: Run Vitest Frontend Tests (OpportunityPanel, EvaluationPage)
        run: npm test
