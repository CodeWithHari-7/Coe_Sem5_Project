version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: companyiq_postgres
    environment:
      POSTGRES_DB: companyiq
      POSTGRES_USER: companyiq
      POSTGRES_PASSWORD: companyiq_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companyiq"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: companyiq_backend
    environment:
      DATABASE_URL: postgresql://companyiq:companyiq_pass@postgres:5432/companyiq
      VECTOR_DB_PATH: /app/chroma_db
      DEMO_MODE: "true"
      FRONTEND_URL: http://localhost:5173
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - chroma_data:/app/chroma_db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: companyiq_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  chroma_data:
